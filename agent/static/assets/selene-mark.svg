<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Standalone copy of the #selene-mark symbol in index.html. A favicon
       renders in its own document and cannot read the page's custom
       properties, so the colors are literal: the default oslo theme's accent
       on the disc and its background in the craters. Keep in step with the
       symbol if the geometry changes. -->
  <circle cx="24" cy="24" r="19" fill="#e8e8e8"/>
  <g fill="#0b0b0b">
    <ellipse cx="29.5" cy="16.5" rx="6.4" ry="4.8" opacity=".30"/>
    <ellipse cx="18" cy="21.5" rx="5.4" ry="4.4" opacity=".26"/>
    <ellipse cx="27.5" cy="29.5" rx="4.6" ry="3.9" opacity=".22"/>
    <circle cx="15" cy="31" r="2.6" opacity=".34"/>
    <circle cx="33" cy="33" r="2" opacity=".30"/>
    <circle cx="20.5" cy="12.5" r="1.8" opacity=".28"/>
    <circle cx="34.5" cy="24" r="1.4" opacity=".24"/>
  </g>
</svg>
